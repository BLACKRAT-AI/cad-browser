<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="base.css">
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.start {
  width: 100%;
  max-width: 560px;
  padding: 0 24px 80px;
  text-align: center;
}

.wordmark {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 22px;
}

.wordmark b {
  color: var(--accent);
  font-weight: 600;
}

form {
  display: flex;
  gap: 8px;
}

input[type="text"] {
  flex: 1;
  font-size: 13px;
  padding: 10px 13px;
  border-radius: var(--radius);
}

input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
}

.links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 26px;
}

.links a {
  font-size: 12px;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px 12px;
}

.links a:hover {
  color: var(--text);
  background: var(--surface);
  text-decoration: none;
}
</style>
</head>
<body>
<div class="start">
  <div class="wordmark">CAD<b>&middot;</b>Browser</div>
  <form id="go">
    <input id="q" type="text" autofocus spellcheck="false"
           placeholder="Search or enter address" aria-label="Search or enter address">
    <button class="primary" type="submit">Go</button>
  </form>
  <div class="links">
    <a href="cad://sysinfo">System info</a>
    <a href="cad://settings">Settings</a>
    <a href="cad://history">History</a>
    <a href="cad://downloads">Downloads</a>
    <a href="cad://about">About</a>
  </div>
</div>
<script src="cad.js"></script>
<script>
document.getElementById('go').addEventListener('submit', function (event) {
  event.preventDefault();
  var value = document.getElementById('q').value.trim();
  if (value) {
    // The browser process decides whether this is a URL or a search, using the
    // same rule the omnibox uses.
    window.cad.send('navigate', { url: value });
  }
});
</script>
</body>
</html>
